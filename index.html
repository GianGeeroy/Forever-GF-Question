<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Important Question 💖</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <div class="bg-hearts"></div>

  <div class="card">
    <h1>Can you be my girlfriend forever? 💍</h1>
    <p class="sub">Choose wisely… no pressure 😳</p>

    <div class="buttons">
      <button id="yesBtn">YES 💖</button>
      <button id="noBtn">NO 💔</button>
    </div>
  </div>

  <!-- Romantic Popup -->
  <div id="popup" class="popup hidden">
    <div class="popup-content">
      <h1>YAAAAAY!!! 💕</h1>
      <p>You just made me the happiest person alive 🥹</p>

      <div class="gallery">
        <img src="images/popup1.jpg">
        <img src="images/popup2.jpg">
        <img src="images/popup3.jpg">
        <img src="images/popup4.jpg">
      </div>

      <button id="closeBtn">Close 💌</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
