<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Question for You 💍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose:        #ff6b8a;
      --rose-deep:   #e0355a;
      --blush:       #ffd6e0;
      --petal:       #fff0f5;
      --cream:       #fff8fa;
      --gold:        #f7c59f;
      --text:        #3d1a26;
      --text-soft:   #7a3d52;
      --glass-bg:    rgba(255, 255, 255, 0.28);
      --glass-border:rgba(255, 255, 255, 0.55);
      --shadow:      0 24px 60px rgba(200, 50, 80, 0.22);
      --radius:      28px;
      --transition:  0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html, body {
      height: 100%;
      font-family: 'Lato', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe4ee 0%, #ffd6e0 20%, #ffb3c6 45%, #ff8fab 70%, #e05c7a 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== FLOATING HEARTS BG ===== */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart-float {
      position: absolute;
      bottom: -60px;
      font-size: 1.4rem;
      opacity: 0;
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-110vh) rotate(25deg) scale(1.2); opacity: 0; }
    }

    /* ===== SCENE ===== */
    .scene {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
      width: 100%;
    }

    /* ===== CARD ===== */
    .card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1.5px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.6);
      padding: 52px 44px 44px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      animation: cardEntrance 0.9s cubic-bezier(0.34, 1.4, 0.64, 1) both;
      overflow: visible;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(40px) scale(0.92); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card__glow {
      position: absolute;
      inset: -2px;
      border-radius: calc(var(--radius) + 2px);
      background: linear-gradient(135deg, #ff6b8a55, #ffd6e055, #e0355a44);
      z-index: -1;
      filter: blur(14px);
      animation: glowPulse 3s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from { opacity: 0.5; transform: scale(1); }
      to   { opacity: 0.85; transform: scale(1.03); }
    }

    .card__ribbon {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #ff8fab, #e0355a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 6px 20px rgba(224,53,90,0.45);
      animation: ribbonBounce 2s ease-in-out infinite;
    }

    @keyframes ribbonBounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(-6px); }
    }

    .card__prelude {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin-bottom: 18px;
      margin-top: 8px;
    }

    .card__question {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4.5vw, 2.2rem);
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: 36px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    }

    /* ===== BUTTONS ===== */
    .card__buttons {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
    }

    .btn {
      cursor: pointer;
      border: none;
      border-radius: 50px;
      font-family: 'Lato', sans-serif;
      font-weight: 400;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      padding: 14px 36px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.25);
      opacity: 0;
      transition: opacity 0.25s;
      border-radius: inherit;
    }

    .btn:hover::after { opacity: 1; }

    /* YES button */
    .btn--yes {
      background: linear-gradient(135deg, #ff6b8a, #e0355a);
      color: #fff;
      box-shadow: 0 8px 28px rgba(224,53,90,0.45);
      min-width: 160px;
      font-size: 1.15rem;
      animation: yesPulse 2.5s ease-in-out infinite;
    }

    @keyframes yesPulse {
      0%, 100% { box-shadow: 0 8px 28px rgba(224,53,90,0.45); }
      50%       { box-shadow: 0 10px 36px rgba(224,53,90,0.7), 0 0 0 6px rgba(224,53,90,0.12); }
    }

    .btn--yes:hover {
      transform: translateY(-4px) scale(1.06);
      box-shadow: 0 14px 40px rgba(224,53,90,0.6);
      animation: none;
    }

    .btn--yes:active {
      transform: translateY(-1px) scale(0.98);
    }

    /* NO button */
    .btn--no {
      background: rgba(255,255,255,0.45);
      color: var(--text-soft);
      border: 1.5px solid rgba(255,107,138,0.3);
      min-width: 110px;
      font-size: 0.92rem;
      transition: background 0.2s, color 0.2s, transform 0.08s;
      position: absolute;
    }

    .btn--no.is-running {
      transition: left 0.15s ease, top 0.15s ease, background 0.2s, color 0.2s;
    }

    .card__hint {
      margin-top: 22px;
      font-size: 0.82rem;
      color: var(--text-soft);
      opacity: 0.7;
      min-height: 18px;
      font-style: italic;
    }

    /* ===== MODAL ===== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .modal.is-open {
      opacity: 1;
      pointer-events: all;
    }

    .modal__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(224,53,90,0.92) 0%, rgba(255,107,138,0.88) 50%, rgba(255,182,193,0.85) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .modal__content {
      position: relative;
      z-index: 1;
      background: var(--glass-bg);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1.5px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px rgba(100,0,30,0.3), inset 0 1px 0 rgba(255,255,255,0.65);
      padding: 44px 36px 40px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      text-align: center;
      transform: scale(0.8) translateY(30px);
      transition: transform 0.55s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.4s;
      opacity: 0;
    }

    .modal.is-open .modal__content {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .modal__burst {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: var(--radius);
    }

    .burst-particle {
      position: absolute;
      font-size: 1.4rem;
      animation: burstFly 1.2s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
      opacity: 1;
    }

    @keyframes burstFly {
      0%   { transform: translate(0,0) scale(0.4) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(var(--dr)); opacity: 0; }
    }

    .modal__emoji {
      display: block;
      font-size: 3rem;
      margin-bottom: 12px;
      animation: emojiPop 0.6s cubic-bezier(0.34,1.8,0.64,1) 0.3s both;
    }

    @keyframes emojiPop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }

    .modal__title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      animation: fadeSlideUp 0.6s ease 0.45s both;
    }

    .modal__subtitle {
      font-size: 1.05rem;
      color: var(--text-soft);
      line-height: 1.7;
      margin-bottom: 34px;
      animation: fadeSlideUp 0.6s ease 0.55s both;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== GALLERY ===== */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
      animation: fadeSlideUp 0.6s ease 0.65s both;
    }

    .gallery__item {
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.55);
      box-shadow: 0 6px 20px rgba(200,50,80,0.2);
      transition: transform 0.3s var(--transition), box-shadow 0.3s;
      background: rgba(255,182,193,0.3);
    }

    .gallery__item:hover {
      transform: scale(1.06) rotate(1.5deg);
      box-shadow: 0 12px 32px rgba(200,50,80,0.38);
    }

    .gallery__item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery__placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: var(--rose);
      height: 100%;
      flex-direction: column;
      gap: 4px;
    }

    .gallery__placeholder span {
      font-size: 0.65rem;
      color: var(--text-soft);
      font-family: 'Lato', sans-serif;
      opacity: 0.7;
      text-align: center;
      padding: 0 6px;
    }

    .btn--close {
      background: linear-gradient(135deg, #ff6b8a, #e0355a);
      color: #fff;
      box-shadow: 0 8px 28px rgba(224,53,90,0.4);
      padding: 14px 40px;
      font-size: 1rem;
      animation: fadeSlideUp 0.6s ease 0.75s both;
    }

    .btn--close:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 14px 36px rgba(224,53,90,0.55);
    }

    /* ===== CONFETTI ===== */
    .confetti {
      position: fixed;
      top: -20px;
      pointer-events: none;
      z-index: 200;
      font-size: 1.2rem;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0.1; }
    }

    /* ===== SCROLLBAR ===== */
    .modal__content::-webkit-scrollbar { width: 6px; }
    .modal__content::-webkit-scrollbar-thumb { background: rgba(255,107,138,0.4); border-radius: 3px; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .card { padding: 44px 22px 34px; }
      .card__buttons { gap: 14px; }
      .btn--yes { min-width: 130px; }
      .modal__content { padding: 34px 20px 30px; }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    }
  </style>
</head>
<body>

  <div class="hearts-bg" id="heartsBg"></div>

  <main class="scene" id="scene">
    <div class="card" id="proposalCard">
      <div class="card__glow"></div>
      <div class="card__ribbon">💌</div>
      <p class="card__prelude">I have one important question…</p>
      <h1 class="card__question">Can you be my girlfriend forever?&nbsp;💍</h1>
      <div class="card__buttons">
        <button class="btn btn--yes" id="yesBtn">YES 💖</button>
        <button class="btn btn--no" id="noBtn">NO 💔</button>
      </div>
      <p class="card__hint" id="noHint"></p>
    </div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__overlay"></div>
    <div class="modal__content">
      <div class="modal__burst" id="burst"></div>
      <div class="modal__text">
        <span class="modal__emoji">🎉</span>
        <h2 class="modal__title">She said YES!!</h2>
        <p class="modal__subtitle">You just made me the happiest person alive. 💖<br>Here's to forever, my bubba.</p>
      </div>
      <div class="gallery" id="gallery"></div>
      <button class="btn btn--close" id="closeBtn">Send a kiss back 💋</button>
    </div>
  </div>

  <script>
    // ── CONFIG ─────────────────────────────────────────────────
    // Add your image paths here, e.g. "images/photo1.jpg"
    const IMAGES = [
      "images/popup1.jpg",
      "images/popup2.jpg",
      "images/popup3.jpg",
        "images/popup4.webpgit add .",
    ];

    const HINTS = [
      "The button seems shy… 👀",
      "Hmm, it keeps running away! 🙈",
      "Is the NO button scared? 😂",
      "Maybe that's a sign… 😇",
      "It really doesn't want to be clicked! 💨",
      "Just one little YES… 🥺",
      "The button has trust issues! 😅",
      "Try harder? Or… just click YES? 💖",
    ];

    // ── DOM REFS ───────────────────────────────────────────────
    const heartsBg     = document.getElementById("heartsBg");
    const yesBtn       = document.getElementById("yesBtn");
    const noBtn        = document.getElementById("noBtn");
    const noHint       = document.getElementById("noHint");
    const modal        = document.getElementById("modal");
    const burst        = document.getElementById("burst");
    const gallery      = document.getElementById("gallery");
    const closeBtn     = document.getElementById("closeBtn");
    const proposalCard = document.getElementById("proposalCard");

    // ── FLOATING HEARTS BACKGROUND ────────────────────────────
    const BG_HEARTS = ["💗","💕","💖","❤️","🌸","💓","✨","🌹"];

    function spawnBgHeart() {
      const el = document.createElement("span");
      el.className = "heart-float";
      el.textContent = BG_HEARTS[Math.floor(Math.random() * BG_HEARTS.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (0.9 + Math.random() * 1.4) + "rem";
      const dur = 7 + Math.random() * 8;
      el.style.animationDuration = dur + "s";
      el.style.animationDelay = (Math.random() * dur) + "s";
      heartsBg.appendChild(el);
      setTimeout(() => el.remove(), dur * 2 * 1000);
    }

    for (let i = 0; i < 18; i++) spawnBgHeart();
    setInterval(spawnBgHeart, 900);

    // ── EVASIVE NO BUTTON ─────────────────────────────────────
    let hintIndex = 0;

    function initNoBtn() {
      const container = noBtn.parentElement;
      const cRect = container.getBoundingClientRect();
      const nRect = noBtn.getBoundingClientRect();
      container.style.position = "relative";
      noBtn.style.position = "absolute";
      noBtn.style.left = (nRect.left - cRect.left) + "px";
      noBtn.style.top  = (nRect.top  - cRect.top)  + "px";
      container.style.minHeight = (noBtn.offsetTop + noBtn.offsetHeight + 10) + "px";
    }

    function moveNoBtn() {
      const container = noBtn.parentElement;
      const cardRect  = proposalCard.getBoundingClientRect();
      const maxX = cardRect.width  - noBtn.offsetWidth  - 16;
      const maxY = cardRect.height - noBtn.offsetHeight - 16;
      let x = Math.random() * maxX;
      let y = Math.random() * maxY;
      const centreX = cardRect.width / 2 - noBtn.offsetWidth / 2;
      if (Math.abs(x - centreX) < 90) {
        x = x > centreX ? Math.min(x + 110, maxX) : Math.max(x - 110, 0);
      }
      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
      noBtn.classList.add("is-running");
      noHint.textContent = HINTS[hintIndex++ % HINTS.length];
    }

    noBtn.addEventListener("mouseenter", moveNoBtn);
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNoBtn(); }, { passive: false });

    document.addEventListener("mousemove", (e) => {
      const r = noBtn.getBoundingClientRect();
      const dist = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      if (dist < 70) moveNoBtn();
    });

    // ── CONFETTI ──────────────────────────────────────────────
    const CONFETTI_ICONS = ["💖","💗","💕","🌸","✨","🎉","💫","❤️","🌹","💝","🥰"];

    function launchConfetti(count = 55) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const el = document.createElement("span");
          el.className = "confetti";
          el.textContent = CONFETTI_ICONS[Math.floor(Math.random() * CONFETTI_ICONS.length)];
          el.style.left = Math.random() * 100 + "vw";
          el.style.fontSize = (0.9 + Math.random() * 1.2) + "rem";
          const dur = 2.5 + Math.random() * 2.5;
          el.style.animationDuration = dur + "s";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), dur * 1000 + 200);
        }, i * 55);
      }
    }

    // ── BURST PARTICLES ───────────────────────────────────────
    function triggerBurst() {
      const icons = ["💖","💗","✨","🌸","💫"];
      for (let i = 0; i < 20; i++) {
        const el = document.createElement("span");
        el.className = "burst-particle";
        el.textContent = icons[Math.floor(Math.random() * icons.length)];
        const angle  = Math.random() * 360;
        const radius = 80 + Math.random() * 130;
        el.style.setProperty("--dx", Math.cos(angle) * radius + "px");
        el.style.setProperty("--dy", Math.sin(angle) * radius + "px");
        el.style.setProperty("--dr", (Math.random() - 0.5) * 360 + "deg");
        el.style.left = "50%";
        el.style.top  = "30%";
        el.style.animationDelay = Math.random() * 0.3 + "s";
        burst.appendChild(el);
        setTimeout(() => el.remove(), 1600);
      }
    }

    // ── GALLERY BUILDER ───────────────────────────────────────
    function buildGallery() {
      gallery.innerHTML = "";
      if (IMAGES.length === 0) {
        [
          { icon: "📸", label: "Add your photos" },
          { icon: "🌹", label: "Your memories here" },
          { icon: "💑", label: "Your love story" },
          { icon: "✈️", label: "Adventures together" },
        ].forEach(({ icon, label }) => {
          const item = document.createElement("div");
          item.className = "gallery__item";
          item.innerHTML = `<div class="gallery__placeholder">${icon}<span>${label}</span></div>`;
          gallery.appendChild(item);
        });
        return;
      }
      IMAGES.forEach(src => {
        const item = document.createElement("div");
        item.className = "gallery__item";
        const img = document.createElement("img");
        img.src = src; img.alt = "Our memory"; img.loading = "lazy";
        item.appendChild(img);
        gallery.appendChild(item);
      });
    }

    // ── YES BUTTON ────────────────────────────────────────────
    yesBtn.addEventListener("click", () => {
      launchConfetti(60);
      buildGallery();
      triggerBurst();
      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      setTimeout(() => launchConfetti(30), 1000);
      setTimeout(() => launchConfetti(25), 2200);
    });

    // ── CLOSE ─────────────────────────────────────────────────
    function closeModal() {
      launchConfetti(20);
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
    }
    closeBtn.addEventListener("click", closeModal);
    modal.querySelector(".modal__overlay").addEventListener("click", closeModal);

    // ── INIT ──────────────────────────────────────────────────
    window.addEventListener("load",   () => setTimeout(initNoBtn, 250));
    window.addEventListener("resize", () => {
      noBtn.style.left = "";
      noBtn.style.top  = "";
      setTimeout(initNoBtn, 100);
    });
  </script>
</body>
</html>
